spring.application.name=acs

management.endpoint.health.probes.enabled=true


management.health.cassandra.enabled=false

# Postgres Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/acs_db}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:acs_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:acs_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Settings
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.cacheTtl=3600
search.result.redis.ttl = 36000


# Elastic Search Settings
elasticsearch.host=${ELASTICSEARCH_HOST:localhost}
elasticsearch.port=${ELASTICSEARCH_PORT:9200}
elasticsearch.username=${ELASTICSEARCH_USERNAME:elastic}
elasticsearch.password=${ELASTICSEARCH_PASSWORD:changeme}

# File Upload Settings (ImportService enforces its own 5MB cap; servlet limit must not be lower)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#Application Specific
search.string.max.regex.length=50

# Auth service configuration
oas.auth.validate-url=${OAS_AUTH_VALIDATE_URL:http://18.183.107.166/auth/v1/auth_token_validate}
oas.auth.api-key=${OAS_AUTH_API_KEY:}

# Lifecycle (draft -> add -> approve -> review) switches
# Service-wide master switch. false => NO catalogue follows the lifecycle: its lifecycle
# endpoints 404 and create persists ACTIVE instead of PENDING. CRUD, search, read, import
# and loadFromPrimary are unaffected.
catalogue.lifecycle.enabled=${CATALOGUE_LIFECYCLE_ENABLED:true}



# Per-catalogue override, keyed by the catalogue's URL segment (lowercase, no separators).
# Effective policy = catalogue.lifecycle.enabled AND catalogue.lifecycle.entities.<name>
# An absent key means enabled, so list a catalogue here only to switch it off.
# Valid names: seed, croptype, cropvariety, cropcategory, livestock, season, soil,
# extensionequipment, pesticide, insecticide, fertilizer, locationobject, locationmapper,
# marketplace

catalogue.lifecycle.entities.locationobject=false
catalogue.lifecycle.entities.locationmapper=false
catalogue.lifecycle.entities.season=false

elastic.required.field.audit.json.path=/EsFieldsmapping/esAuditRequiredFields.json
elastic.required.field.seed.json.path=/EsFieldsmapping/esSeedRequiredFields.json
elastic.required.field.croptype.json.path=/EsFieldsmapping/esCroptypeRequiredFields.json
elastic.required.field.cropvariety.json.path=/EsFieldsmapping/esCropvarietyRequiredFields.json
elastic.required.field.cropcategory.json.path=/EsFieldsmapping/esCropcategoryRequiredFields.json
elastic.required.field.livestock.json.path=/EsFieldsmapping/esLivestockRequiredFields.json
elastic.required.field.livestockbreed.json.path=/EsFieldsmapping/esLivestockbreedRequiredFields.json
elastic.required.field.livestockcategory.json.path=/EsFieldsmapping/esLivestockcategoryRequiredFields.json
elastic.required.field.season.json.path=/EsFieldsmapping/esSeasonRequiredFields.json
elastic.required.field.soil.json.path=/EsFieldsmapping/esSoilRequiredFields.json
